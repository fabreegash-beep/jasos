        }

        button:hover:not(:disabled) {

        }

        button:disabled {
            opacity: 0.5;

        }

        .btn-secondary {

                <input type="number" id="maxPlayers" min="3" max="10" value="5">
                
                <label>🎮 طور اللعبة:</label>
                <select id="gameMode">
                    <option value="ONLINE">💬 أونلاين (دردشة مدمجة)</option>
                    <option value="LOCAL">🎭 محلي (شفاهي - تظهر الكلمة لكل لاعب)</option>
                </select>
                
                <button onclick="createRoom()">✅ إنشاء الغرفة</button>
                <button onclick="backToStart()" class="btn-secondary">↩️ رجوع</button>
            </div>
        </div>

        <!-- شاشة الانضمام -->
        <div id="joinScreen" class="screen">
            <div class="card">
                <h2>🔑 الانضمام إلى غرفة</h2>
                <input type="text" id="roomCodeJoin" placeholder="📝 كود الغرفة (4 أرقام)" maxlength="4">
                <button onclick="joinRoom()">✅ انضمام</button>
                <button onclick="backToStart()" class="btn-secondary">↩️ رجوع</button>
            </div>
        </div>

                    <div class="game-info">

                    </div>
                    
                    <div id="playersContainer" class="players-list"></div>
                    
                    <div id="gameStatus"></div>
                    
                    <div id="actionButtons">
                        <button id="startGameBtn" onclick="startGame()" style="display: none;">🎮 بدء اللعبة</button>
                    </div>
                </div>
                
                <div class="card" style="flex: 3;">
                    <h2>💬 الدردشة</h2>
                    <div class="chat-area">
                        <div id="messages" class="messages"></div>
                        <div class="chat-input-area">

        // ==================== التحقق من الاسم ====================
        function validateName() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();
            const nameError = document.getElementById('nameError');
            
            if (!name) {
                nameError.textContent = '❌ الرجاء إدخال اسمك';
                document.getElementById('createRoomBtn').disabled = true;
                document.getElementById('joinRoomBtn').disabled = true;
                return false;
            }
            
            if (name.length < 2) {
                nameError.textContent = '❌ الاسم يجب أن يكون حرفين على الأقل';
                document.getElementById('createRoomBtn').disabled = true;
                document.getElementById('joinRoomBtn').disabled = true;
                return false;
            }
            
            nameError.textContent = '';
            document.getElementById('createRoomBtn').disabled = false;
            document.getElementById('joinRoomBtn').disabled = false;
            return true;
        }
        
        // مراقبة تغيير الاسم
        document.getElementById('playerName').addEventListener('input', validateName);
        
        // ==================== شاشات ====================
        function showCreateRoom() {
            if (!validateName()) return;
            currentPlayer.name = document.getElementById('playerName').value.trim();
            document.getElementById('createScreen').classList.add('active');
            document.getElementById('startScreen').classList.remove('active');
        }
        
        function showJoinRoom() {
            if (!validateName()) return;
            currentPlayer.name = document.getElementById('playerName').value.trim();
            document.getElementById('joinScreen').classList.add('active');
            document.getElementById('startScreen').classList.remove('active');
        }
        
        function backToStart() {
            document.getElementById('startScreen').classList.add('active');
            document.getElementById('createScreen').classList.remove('active');
            document.getElementById('joinScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.remove('active');

                roomListener.off();

            }
            if (chatListener) {

                chatListener = null;
            }
        }
        
        // ==================== إنشاء غرفة ====================
        async function createRoom() {
            const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
            const gameMode = document.getElementById('gameMode').value;
            
            if (maxPlayers < 3 || maxPlayers > 10) {
                showAlert('⚠️ عدد اللاعبين يجب أن يكون بين 3 و 10', 'error');
                return;
            }
            
            showLoading();
            
            // إنشاء كود عشوائي 4 أرقام
            let roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            // التحقق من عدم وجود الغرفة
            const snapshot = await database.ref(`rooms/${roomCode}`).once('value');
            if (snapshot.exists()) {
                roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            }
            
            const roomData = {
                code: roomCode,
                host: currentPlayer.name,
                maxPlayers: maxPlayers,
                mode: gameMode,

                showAlert('❌ كود الغرفة يجب أن يكون 4 أرقام', 'error');
                return;

                hideLoading();
                showAlert('❌ الغرفة غير موجودة', 'error');
                return;
            }

                return;
            }
            
            if (room.gameStarted) {
                hideLoading();
                showAlert('❌ اللعبة بدأت بالفعل', 'error');
                return;
            }
            
            if (room.players.includes(currentPlayer.name)) {
                hideLoading();
                showAlert('❌ هذا الاسم موجود بالفعل في الغرفة', 'error');
                return;
            }
            
            // إضافة اللاعب
            const newPlayers = [...room.players, currentPlayer.name];
            const newPlayersData = [...room.playersData, { name: currentPlayer.name, isHost: false }];
            
            await database.ref(`rooms/${roomCode}`).update({
                players: newPlayers,
                playersData: newPlayersData
            });
            
            currentPlayer.roomCode = roomCode;
            currentPlayer.isHost = false;
            gameState.mode = room.mode;
            
            hideLoading();
            enterGameRoom(roomCode);
            showAlert(`✅ انضممت إلى الغرفة ${roomCode}`, 'success');
        }
        
        // ==================== دخول غرفة اللعبة ====================
        function enterGameRoom(roomCode) {
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('createScreen').classList.remove('active');
            document.getElementById('joinScreen').classList.remove('active');
            document.getElementById('startScreen').classList.remove('active');
            
            document.getElementById('roomCodeDisplay').textContent = roomCode;
            
            // الاستماع لتحديثات الغرفة
            if (roomListener) roomListener.off();
            roomListener = database.ref(`rooms/${roomCode}`);
            roomListener.on('value', (snapshot) => {
                const room = snapshot.val();
                if (room) {
                    updateGameState(room);
                } else {
                    showAlert('❌ تم حذف الغرفة', 'error');
                    backToStart();
                }
            });
            
            // الاستماع للدردشة
            if (chatListener) chatListener.off();
            chatListener = database.ref(`chats/${roomCode}`);
            chatListener.on('child_added', (snapshot) => {
                const chat = snapshot.val();
                addChatMessageUI(chat.sender, chat.message, chat.type);
            });
        }
        
        // ==================== تحديث حالة اللعبة ====================
        function updateGameState(room) {
            gameState.players = room.players || [];
            gameState.playersData = room.playersData || [];
            gameState.started = room.gameStarted || false;
            gameState.mode = room.mode;
            gameState.secretWord = room.secretWord;
            gameState.spyName = room.spyName;
            gameState.roundEnded = room.roundEnded;
            gameState.votes = room.votes || {};
            
            // تحديث بيانات اللاعب الحالي
            const myData = gameState.playersData.find(p => p.name === currentPlayer.name);
            if (myData) {
                currentPlayer.isHost = myData.isHost;
                currentPlayer.isSpy = (currentPlayer.name === gameState.spyName);
                if (gameState.secretWord && !currentPlayer.isSpy) {
                    currentPlayer.secretWord = gameState.secretWord;
                }
            }
            
            updatePlayersList();
            updateGameUI();
        }
        
        // ==================== تحديث قائمة اللاعبين ====================
        function updatePlayersList() {
            const container = document.getElementById('playersContainer');
            container.innerHTML = '';
            
            gameState.playersData.forEach(player => {
                const playerCard = document.createElement('div');
                playerCard.className = 'player-card';
                if (player.name === gameState.spyName && gameState.started) {
                    playerCard.classList.add('spy');
                }
                if (player.isHost) {
                    playerCard.classList.add('host');
                }
                
                playerCard.innerHTML = `
                    <div class="player-icon">${player.name === gameState.spyName && gameState.started ? '🕵️' : '👤'}</div>
                    <div class="player-name">${player.name}</div>
                    ${player.isHost ? '<div class="player-badge badge-host">👑 مضيف</div>' : ''}
                    ${player.name === gameState.spyName && gameState.started ? '<div class="player-badge badge-spy">🕵️ جاسوس</div>' : ''}
                `;
                
                container.appendChild(playerCard);
            });
            
            const statusDiv = document.getElementById('gameStatus');
            if (!gameState.started) {
                statusDiv.innerHTML = `
                    <div style="text-align: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px;">
                        👥 اللاعبون: ${gameState.players.length}/${roomMaxPlayers()}
                        ${gameState.players.length >= 3 ? '<br>✅ يمكن بدء اللعبة!' : '<br>⚠️ يحتاج إلى 3 لاعبين على الأقل'}
                    </div>
                `;
                
                // إظهار زر بدء اللعبة للمضيف فقط
                const startBtn = document.getElementById('startGameBtn');
                if (currentPlayer.isHost && !gameState.started && gameState.players.length >= 3) {
                    startBtn.style.display = 'block';
                } else {
                    startBtn.style.display = 'none';
                }
            } else {
                statusDiv.innerHTML = `
                    <div style="text-align: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px;">
                        🎮 اللعبة جارية...
                    </div>
                `;
                document.getElementById('startGameBtn').style.display = 'none';
            }
        }
        
        function roomMaxPlayers() {
            // نحتاج للحصول على maxPlayers من Firebase
            return 10; // مؤقت
        }
        
        // ==================== تحديث واجهة اللعبة ====================
        function updateGameUI() {
            const specialControls = document.getElementById('specialControls');
            
            if (!gameState.started || gameState.roundEnded) {
                if (gameState.roundEnded) {
                    specialControls.innerHTML += `
                        <div style="margin-top: 20px; text-align: center;">
                            ${currentPlayer.isHost ? '<button onclick="resetGame()" class="btn-success">🔄 جولة جديدة</button>' : '⏳ انتظر بدء جولة جديدة...'}
                        </div>
                    `;
                }
                return;
            }
            
            if (gameState.mode === 'LOCAL') {
                // الوضع المحلي
                specialControls.innerHTML = `
                    <div class="local-mode" style="text-align: center; padding: 20px; background: rgba(255,193,7,0.2); border-radius: 15px;">
                        <h3>🎭 الوضع المحلي</h3>
                        <div style="font-size: 32px; background: #000; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 300px; cursor: pointer;" 
                             onclick="this.style.filter = this.style.filter === 'blur(10px)' ? 'none' : 'blur(10px)'">
                            ${currentPlayer.isSpy ? '🕵️ أنت الجاسوس!' : gameState.secretWord}
                        </div>
                        <p style="color: #ffc107;">⚠️ اضغط على الكلمة لإخفائها/إظهارها</p>
                    </div>
                `;
            } else {
                // الوضع الأونلاين
                if (currentPlayer.isSpy) {
                    specialControls.innerHTML = `
                        <div class="spy-message">
                            🕵️ أنت الجاسوس! 🕵️
                            <br>
                            <small>تظاهر أنك تعرف المكان وحاول اكتشافه من الأسئلة!</small>
                            <br>
                            <button onclick="guessWord()" class="btn-success" style="margin-top: 10px;">🔍 تخمين المكان</button>
                        </div>
                    `;
                } else {
                    specialControls.innerHTML = `
                        <div class="secret-word">
                            🔐 كلمتك السرية: ${gameState.secretWord}
                        </div>
                        <p style="text-align: center; color: #ffc107;">⚠️ لا تخبر أحداً بهذه الكلمة!</p>
                    `;
                }
                
                // إضافة أزرار التصويت إذا لم تنته الجولة
                if (!gameState.roundEnded && !gameState.votes[currentPlayer.name]) {
                    addVoteButtons();
                }
            }
        }
        
        // ==================== بدء اللعبة ====================
        async function startGame() {
            if (!currentPlayer.isHost) return;
            if (gameState.players.length < 3) {
                showAlert('⚠️ تحتاج إلى 3 لاعبين على الأقل', 'error');
                return;
            }
            
            // اختيار كلمة سرية
            const secretWord = SECRET_WORDS[Math.floor(Math.random() * SECRET_WORDS.length)];
            
            // اختيار جاسوس عشوائي
            const randomIndex = Math.floor(Math.random() * gameState.players.length);
            const spyName = gameState.players[randomIndex];
            
            await database.ref(`rooms/${currentPlayer.roomCode}`).update({
                gameStarted: true,
                roundEnded: false,
                secretWord: secretWord,
                spyName: spyName,
                votes: {}
            });
            
            addSystemMessage(`🎮 بدأت اللعبة! ${gameState.mode === 'ONLINE' ? 'استخدموا الدردشة للأسئلة' : 'العبوا شفاهياً!'}`);
            addSystemMessage(`🔍 عدد اللاعبين: ${gameState.players.length} | هناك جاسوس واحد بينكم!`);
        }
        
        // ==================== أزرار التصويت ====================
        function addVoteButtons() {
            const specialControls = document.getElementById('specialControls');
            const buttonsHtml = `
                <div style="margin-top: 20px;">
                    <h3>🗳️ التصويت على الجاسوس</h3>
                    <div class="vote-buttons">
                        ${gameState.players.map(p => `
                            <button class="vote-btn" onclick="voteFor('${p}')">🗳️ ${p}</button>
                        `).join('')}
                    </div>
                </div>
            `;
            specialControls.innerHTML += buttonsHtml;
        }
        
        // ==================== التصويت ====================
        async function voteFor(votedPlayer) {
            if (gameState.roundEnded) {
                showAlert('⚠️ انتهت الجولة', 'error');
                return;
            }
            if (gameState.votes[currentPlayer.name]) {
                showAlert('⚠️ لقد صوت مسبقاً', 'error');
                return;
            }
            
            const newVotes = { ...gameState.votes, [currentPlayer.name]: votedPlayer };
            await database.ref(`rooms/${currentPlayer.roomCode}/votes`).set(newVotes);
            addSystemMessage(`🗳️ ${currentPlayer.name} صوت على ${votedPlayer}`);
            
            // التحقق من اكتمال التصويت
            if (Object.keys(newVotes).length === gameState.players.length) {
                resolveVote(newVotes);
            }
        }
        
        // ==================== حل نتيجة التصويت ====================
        async function resolveVote(votes) {
            // حساب عدد الأصوات
            const voteCount = {};
            for (const voted of Object.values(votes)) {
                voteCount[voted] = (voteCount[voted] || 0) + 1;
            }
            
            let mostVoted = null;
            let maxVotes = 0;
            for (const [player, count] of Object.entries(voteCount)) {
                if (count > maxVotes) {
                    maxVotes = count;
                    mostVoted = player;
                }
            }
            
            if (mostVoted === gameState.spyName) {
                addSystemMessage(`🎉 اللاعبون فازوا! الجاسوس ${gameState.spyName} تم كشفه! المكان كان: ${gameState.secretWord}`, 'winner');
                await database.ref(`rooms/${currentPlayer.roomCode}`).update({ roundEnded: true });
            } else {
                addSystemMessage(`❌ لم يتم كشف الجاسوس! تم إقصاء ${mostVoted} خطأً`);
                
                // إزالة اللاعب المُقصى
                const newPlayers = gameState.players.filter(p => p !== mostVoted);
                const newPlayersData = gameState.playersData.filter(p => p.name !== mostVoted);
                
                await database.ref(`rooms/${currentPlayer.roomCode}`).update({
                    players: newPlayers,
                    playersData: newPlayersData,
                    votes: {}
                });
                
                if (newPlayers.length === 1 && newPlayers[0] === gameState.spyName) {
                    addSystemMessage(`😈 الجاسوس ${gameState.spyName} فاز (بقي وحده)! المكان كان: ${gameState.secretWord}`, 'spy');
                    await database.ref(`rooms/${currentPlayer.roomCode}`).update({ roundEnded: true });
                }
            }
        }
        
        // ==================== تخمين الجاسوس ====================
        async function guessWord() {
            const guessed = prompt('🔍 ما هو المكان الذي تعتقد أنه الكلمة السرية؟');
            if (!guessed) return;
            
            if (guessed === gameState.secretWord) {
                addSystemMessage(`😈 الجاسوس ${currentPlayer.name} فاز! المكان كان: ${gameState.secretWord}`, 'spy');
                await database.ref(`rooms/${currentPlayer.roomCode}`).update({ roundEnded: true });
            } else {
                showAlert('❌ تخمين خاطئ! حاول مرة أخرى', 'error');
            }
        }
        
        // ==================== إعادة تعيين ====================
        async function resetGame() {
            if (!currentPlayer.isHost) return;
            
            await database.ref(`rooms/${currentPlayer.roomCode}`).update({
                gameStarted: false,
                roundEnded: false,
                secretWord: '',
                spyName: '',
                votes: {}
            });
            
            document.getElementById('specialControls').innerHTML = '';
            addSystemMessage('🔄 تم إعادة تعيين اللعبة! اضغط بدء للعب جولة جديدة');
        }
        
        // ==================== مغادرة الغرفة ====================
        async function leaveRoom() {
            if (!confirm('هل تريد مغادرة الغرفة؟')) return;
            
            // إزالة اللاعب من الغرفة
            const newPlayers = gameState.players.filter(p => p !== currentPlayer.name);
            const newPlayersData = gameState.playersData.filter(p => p.name !== currentPlayer.name);
            
            // إذا كان المضيف يغادر، اختر مضيفاً جديداً
            let updateData = { players: newPlayers, playersData: newPlayersData };
            if (currentPlayer.isHost && newPlayersData.length > 0) {
                updateData.host = newPlayersData[0].name;
                updateData.playersData = newPlayersData.map((p, i) => ({ ...p, isHost: i === 0 }));
            }
            
            await database.ref(`rooms/${currentPlayer.roomCode}`).update(updateData);
            
            // إذا كانت الغرفة فارغة، احذفها
            if (newPlayers.length === 0) {
                await database.ref(`rooms/${currentPlayer.roomCode}`).remove();
            }
            
            backToStart();
        }
        
        // ==================== الدردشة ====================
        function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const chatData = {
                sender: currentPlayer.name,
                message: message,
                type: 'normal',
                timestamp: Date.now()
            };
            
            database.ref(`chats/${currentPlayer.roomCode}`).push(chatData);
            input.value = '';
        }
        
        function addChatMessageUI(sender, message, type) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function addSystemMessage(message, type = 'system') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `📢 ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // حفظ في Firebase
            if (currentPlayer.roomCode) {
                database.ref(`chats/${currentPlayer.roomCode}`).push({
                    sender: 'النظام',
                    message: message,
                    type: type,
                    timestamp: Date.now()
                });
            }
        }
        
        // ==================== أدوات ====================
        function copyRoomCode() {
            const code = document.getElementById('roomCodeDisplay').textContent;
            navigator.clipboard.writeText(code);
            showAlert('📋 تم نسخ كود الغرفة!', 'success');
        }
        
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }
        
        function showLoading() {
            // يمكن إضافة مؤشر تحميل
        }
        
        function hideLoading() {
            // إخفاء مؤشر التحميل
        }
        
        // التحقق من الاسم عند التحميل
        validateName();
    </script>
</body>
</html>
